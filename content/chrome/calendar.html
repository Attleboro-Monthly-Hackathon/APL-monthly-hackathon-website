<div class="calendar-panel">
  <div class="calendar-panel__frame">
    <iframe
      loading="lazy"
      referrerpolicy="no-referrer-when-downgrade"
      title="{calendarTitle}"
      src="{googleCalendarEmbedUrl}"
    ></iframe>
  </div>
  <p class="calendar-panel__note">{calendarNote}</p>
</div>
